<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      padding: 2px 0;
    }
    .loc-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .loc-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 12px;
      border: 2px solid var(--btn-border, #1D4ED8);
      background: var(--btn-bg, #1D4ED8);
      color: var(--btn-fg, #FFFFFF);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .loc-btn:hover { opacity: 0.92; }
    .loc-btn:active { transform: scale(0.98); }
    .loc-btn:disabled { opacity: 0.65; cursor: wait; }
    .loc-status {
      font-size: 13.5px;
      line-height: 1.4;
      color: var(--text-soft, #475569);
    }
    .loc-status.error { color: #dc2626; }
    .loc-status.ok { color: #16a34a; font-weight: 500; }

    body.night .loc-btn {
      --btn-bg: #60A5FA;
      --btn-border: #60A5FA;
      --btn-fg: #04122E;
    }
    body.night .loc-status { --text-soft: #cbd5e1; }
    body.night .loc-status.error { color: #f87171; }
    body.night .loc-status.ok { color: #4ade80; }
  </style>
</head>
<body>
  <div class="loc-wrap">
    <button id="locBtn" class="loc-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
      </svg>
      <span id="btnText">My Location</span>
    </button>
    <span id="statusText" class="loc-status"></span>
  </div>

  <script>
    const btn = document.getElementById("locBtn");
    const btnText = document.getElementById("btnText");
    const statusText = document.getElementById("statusText");

    function sendMessageToStreamlit(type, data) {
      window.parent.postMessage(
        Object.assign({ isStreamlitMessage: true, type: type }, data),
        "*"
      );
    }

    function setFrameHeight() {
      const h = Math.max(document.body.scrollHeight, 52);
      sendMessageToStreamlit("streamlit:setFrameHeight", { height: h });
    }

    function setValue(val) {
      sendMessageToStreamlit("streamlit:setComponentValue", {
        value: val,
        dataType: "json"
      });
    }

    function setStatus(msg, cls, isHtml) {
      if (isHtml) {
        statusText.innerHTML = msg;
      } else {
        statusText.textContent = msg;
      }
      statusText.className = "loc-status" + (cls ? " " + cls : "");
      setFrameHeight();
    }

    async function fallbackIpLocation() {
      const endpoints = [
        {
          url: "https://ipwho.is/",
          parse: (d) => d && d.success !== false && d.latitude && d.longitude
            ? { lat: Number(d.latitude), lon: Number(d.longitude), city: d.city || "" }
            : null
        },
        {
          url: "https://ipapi.co/json/",
          parse: (d) => d && d.latitude && d.longitude
            ? { lat: Number(d.latitude), lon: Number(d.longitude), city: d.city || "" }
            : null
        }
      ];
      for (const ep of endpoints) {
        try {
          const resp = await fetch(ep.url, { cache: "no-store" });
          if (!resp.ok) continue;
          const json = await resp.json();
          const parsed = ep.parse(json);
          if (parsed) return parsed;
        } catch (_) {}
      }
      return null;
    }

    async function locateUser() {
      btn.disabled = true;
      btnText.textContent = "Đang xác định vị trí...";
      setStatus("Vui lòng cho phép truy cập vị trí trên trình duyệt.", "");

      const emitSuccess = (lat, lon, accuracy, source, note) => {
        btn.disabled = false;
        btnText.textContent = "My Location";
        const gmapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;
        const htmlMsg = `${note} · <a href="${gmapsUrl}" target="_blank" rel="noopener noreferrer" style="color:inherit;font-weight:700;text-decoration:underline;">Your current location in Google Maps ↗</a>`;
        setStatus(htmlMsg, "ok", true);
        setValue({
          lat: Number(lat.toFixed(6)),
          lon: Number(lon.toFixed(6)),
          accuracy: accuracy ? Math.round(accuracy) : null,
          source: source,
          ts: Date.now()
        });
      };

      const tryFallback = async (reason) => {
        const ipLoc = await fallbackIpLocation();
        if (ipLoc) {
          const area = ipLoc.city ? ` (${ipLoc.city})` : "";
          emitSuccess(
            ipLoc.lat,
            ipLoc.lon,
            5000,
            "ip",
            `Đã lấy vị trí ước tính theo mạng${area}: ${ipLoc.lat.toFixed(4)}, ${ipLoc.lon.toFixed(4)}`
          );
        } else {
          btn.disabled = false;
          btnText.textContent = "My Location";
          setStatus(reason, "error");
        }
      };

      if (!navigator.geolocation) {
        await tryFallback("Trình duyệt không hỗ trợ định vị GPS.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          const accTxt = accuracy ? ` (±${Math.round(accuracy)}m)` : "";
          emitSuccess(
            latitude,
            longitude,
            accuracy,
            "gps",
            `Đã xác định vị trí${accTxt}: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`
          );
        },
        async (err) => {
          let msg = "Không lấy được vị trí GPS.";
          if (err && err.code === 1) {
            msg = "Bạn đã từ chối quyền vị trí. Hãy bật quyền Vị trí (Location) trong trình duyệt.";
          } else if (err && err.code === 2) {
            msg = "Không thể xác định vị trí thiết bị.";
          } else if (err && err.code === 3) {
            msg = "Hết thời gian chờ định vị GPS.";
          }
          await tryFallback(msg);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
      );
    }

    btn.addEventListener("click", locateUser);

    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "streamlit:render") return;
      const args = event.data.args || {};
      if (args.theme === "night") {
        document.body.classList.add("night");
      } else {
        document.body.classList.remove("night");
      }
      if (args.current_label && !statusText.textContent) {
        setStatus(args.current_label, "ok", true);
      }
      setFrameHeight();
    });

    sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    setFrameHeight();
  </script>
</body>
</html>
