<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- mv-model.svg — lớp HUD "ngắm mục tiêu" ở giữa-phải banner (nhúng làm biến CSS --model).
       Nét trắng/xanh trong suốt để đặt chồng lên ảnh bìa nào cũng hợp. -->
  <defs>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity=".35"/>
      <stop offset=".4" stop-color="#3B82F6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="400" cy="400" r="380" fill="url(#core)"/>

  <g fill="none" stroke="#E0F2FE" filter="url(#glow)">
    <!-- vòng chính -->
    <circle cx="400" cy="400" r="300" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="400" cy="400" r="232" stroke-opacity=".3" stroke-dasharray="1 7" stroke-width="2"/>
    <circle cx="400" cy="400" r="150" stroke-opacity=".45"/>
    <circle cx="400" cy="400" r="12" stroke-opacity=".9" stroke-width="2"/>

    <!-- cung nhấn -->
    <path d="M400 100 A300 300 0 0 1 680 290" stroke="#38BDF8" stroke-opacity=".95" stroke-width="5" stroke-linecap="round"/>
    <path d="M140 550 A300 300 0 0 1 120 420" stroke="#38BDF8" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>

    <!-- thập tự ngắm -->
    <path d="M400 40V180M400 620V760M40 400H180M620 400H760" stroke-opacity=".6" stroke-width="1.5"/>
    <path d="M400 370V385M400 415V430M370 400H385M415 400H430" stroke-opacity=".95" stroke-width="2"/>

    <!-- góc khung -->
    <path d="M230 230h-40v40M570 230h40v40M230 570h-40v-40M570 570h40v-40" stroke-opacity=".8" stroke-width="2.5"/>
  </g>

  <!-- vạch chia độ -->
  <g stroke="#E0F2FE" stroke-opacity=".5" stroke-width="2">
    <path d="M400 92v16M708 400h-16M400 708v-16M92 400h16"/>
    <path d="M617.8 182.2l-11.3 11.3M617.8 617.8l-11.3-11.3M182.2 617.8l11.3-11.3M182.2 182.2l11.3 11.3"/>
  </g>

  <!-- nhãn dữ liệu (chỉ là ký hiệu, không phải chữ đọc) -->
  <g fill="#E0F2FE" fill-opacity=".75">
    <rect x="610" y="470" width="120" height="3"/>
    <rect x="610" y="480" width="80" height="3" fill-opacity=".45"/>
    <rect x="610" y="490" width="100" height="3" fill-opacity=".3"/>
    <rect x="70" y="250" width="90" height="3"/>
    <rect x="70" y="260" width="60" height="3" fill-opacity=".45"/>
    <circle cx="590" cy="471" r="5" fill="#38BDF8" fill-opacity="1"/>
    <circle cx="180" cy="251" r="5" fill="#F87171" fill-opacity="1"/>
  </g>

  <!-- điểm nóng (ổ dịch) -->
  <g fill="#F87171">
    <circle cx="470" cy="330" r="6"/>
    <circle cx="470" cy="330" r="16" fill="none" stroke="#F87171" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="335" cy="465" r="4" fill-opacity=".85"/>
    <circle cx="505" cy="470" r="3" fill-opacity=".7"/>
  </g>
</svg>
