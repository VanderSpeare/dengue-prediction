<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="100%" stop-color="#070710"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="lineGradTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="lineGradPurple" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <!-- Grid lines -->
  <g stroke="url(#lineGradTeal)" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/><line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>
  <!-- Diagonal lines -->
  <g stroke="url(#lineGradPurple)" stroke-width="0.3">
    <line x1="0" y1="0" x2="400" y2="400"/><line x1="200" y1="0" x2="600" y2="400"/>
    <line x1="400" y1="0" x2="800" y2="400"/><line x1="600" y1="0" x2="1000" y2="400"/>
    <line x1="800" y1="0" x2="1200" y2="400"/><line x1="1200" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="600" y2="400"/><line x1="800" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="200" y2="400"/><line x1="400" y1="0" x2="0" y2="400"/>
  </g>
  <!-- Node dots at intersections -->
  <g fill="#0d9488" filter="url(#glow)">
    <circle cx="150" cy="80" r="2.5" opacity="0.7"/><circle cx="300" cy="160" r="2" opacity="0.5"/>
    <circle cx="450" cy="80" r="3" opacity="0.8"/><circle cx="600" cy="240" r="2.5" opacity="0.6"/>
    <circle cx="750" cy="160" r="2" opacity="0.5"/><circle cx="900" cy="320" r="2.5" opacity="0.7"/>
    <circle cx="1050" cy="80" r="2" opacity="0.4"/><circle cx="300" cy="320" r="3" opacity="0.6"/>
    <circle cx="600" cy="80" r="2" opacity="0.5"/><circle cx="900" cy="160" r="2.5" opacity="0.7"/>
    <circle cx="150" cy="240" r="2" opacity="0.4"/><circle cx="450" cy="320" r="2.5" opacity="0.6"/>
    <circle cx="750" cy="240" r="3" opacity="0.8"/><circle cx="1050" cy="320" r="2" opacity="0.5"/>
  </g>
  <!-- Purple nodes -->
  <g fill="#7c3aed" filter="url(#glow)">
    <circle cx="200" cy="120" r="1.5" opacity="0.5"/><circle cx="500" cy="200" r="2" opacity="0.4"/>
    <circle cx="700" cy="100" r="1.5" opacity="0.6"/><circle cx="1000" cy="280" r="2" opacity="0.5"/>
    <circle cx="350" cy="260" r="1.5" opacity="0.4"/><circle cx="850" cy="60" r="2" opacity="0.5"/>
  </g>
  <!-- Accent hexagons -->
  <g stroke="#0d9488" stroke-width="0.8" fill="none" opacity="0.2">
    <polygon points="600,170 620,180 620,200 600,210 580,200 580,180"/>
    <polygon points="300,90 315,98 315,112 300,120 285,112 285,98"/>
    <polygon points="900,250 918,260 918,278 900,288 882,278 882,260"/>
  </g>
</svg>
